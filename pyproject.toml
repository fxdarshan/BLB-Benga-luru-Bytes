[project]
name = "recommender"
version = "0.1.0"
description = "BLB (Banga-Luru_Bytes): AI-powered restaurant recommendations for Bangalore"
readme = "Doc/problemStatement.md"
requires-python = ">=3.10"
# What the API server needs. The Streamlit app and ingestion add their own groups below.
dependencies = [
    "anthropic",
    "cachetools",
    "fastapi",
    "groq",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
# Builds data/ from the raw dataset: `uv run python -m recommender.ingest`.
ingest = [
    "datasets",
    "ftfy",
    "pandas",
]
[tool.uv]
# Installed locally by default, so every command works as before. The server image leaves
# them out with `uv sync --no-default-groups`.
default-groups = ["dev", "ingest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["Doc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
