[project]
name = "recommender"
version = "0.1.0"
description = "BLB (Banga-Luru_Bytes): AI-powered restaurant recommendations for Bangalore"
readme = "Doc/problemStatement.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "cachetools",
    "datasets",
    "ftfy",
    "groq",
    "pandas",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["Doc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
