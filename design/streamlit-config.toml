# BLB dark theme for Streamlit.
# To use it: copy this file to  .streamlit/config.toml  in the project folder
# (create the .streamlit folder if it is not there), then restart the app.

[theme]
base = "dark"
primaryColor = "#F5A524"              # accent: button, slider, selected items
backgroundColor = "#0E1013"           # page
secondaryBackgroundColor = "#161A20"  # form, inputs, sidebar
textColor = "#ECEEF1"                 # main text
font = "sans serif"
